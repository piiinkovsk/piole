<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Piole - Cosmetics Collection</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
    }
    .container {
      max-width: 100%;
      margin: 0 auto;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }
    .header h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 600;
    }
    .tabs {
      display: flex;
      margin-bottom: 24px;
      border-bottom: 1px solid #e0e0e0;
    }
    .tab {
      padding: 12px 24px;
      cursor: pointer;
      border: none;
      background: none;
      font-size: 14px;
      font-weight: 500;
      color: #666;
      position: relative;
    }
    .tab.active {
      color: #000;
    }
    .tab.active:after {
      content: '';
      position: absolute;
      bottom: -1px;
      left: 0;
      right: 0;
      height: 2px;
      background-color: #4CAF50;
    }
    .form-group {
      margin-bottom: 24px;
    }
    .label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 8px;
    }
    .required:after {
      content: ' *';
      color: #f44336;
    }
    .form-control {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
      box-sizing: border-box;
    }
    .category-tree {
      max-height: 300px;
      overflow-y: auto;
      border: 1px solid #ddd;
      border-radius: 4px;
      padding: 12px;
      margin-top: 8px;
    }
    .category-item {
      margin: 8px 0;
      padding-left: 24px;
    }
    .category-item label {
      display: block;
      padding: 6px 0;
      cursor: pointer;
      font-size: 14px;
    }
    .subcategory {
      margin-left: 20px;
      border-left: 1px solid #ddd;
      padding-left: 12px;
    }
    .button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      background-color: #4CAF50;
      color: white;
      transition: background-color 0.2s;
    }
    .button:hover {
      background-color: #45a049;
    }
    .button:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }
    .preview {
      margin: 24px 0;
      padding: 16px;
      border: 1px solid #ddd;
      border-radius: 4px;
      background-color: #f9f9f9;
    }
    .preview-image {
      width: 100%;
      max-height: 200px;
      object-fit: cover;
      border-radius: 4px;
      margin-bottom: 12px;
    }
    .preview-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 8px;
    }
    .preview-info {
      font-size: 14px;
      color: #666;
      margin-bottom: 4px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Save to Piole</h1>
    </div>

    <div class="tabs">
      <button class="tab active" data-tab="wishlist">Wishlist</button>
      <button class="tab" data-tab="collection">Collection</button>
    </div>

    <form id="product-form">
      <div class="preview">
        <img id="preview-image" class="preview-image" src="" alt="Product Preview">
        <div class="preview-title" id="preview-title">Product Title</div>
        <div class="preview-info" id="preview-price">Price: N/A</div>
      </div>

      <div class="form-group">
        <label class="label required">Product Name</label>
        <input type="text" class="form-control" id="product-name" required>
      </div>

      <div class="form-group">
        <label class="label required">Brand</label>
        <input type="text" class="form-control" id="product-brand" required>
      </div>

      <div class="form-group">
        <label class="label">Price</label>
        <input type="number" class="form-control" id="product-price" step="0.01">
      </div>

      <div class="form-group">
        <label class="label required">Category</label>
        <div class="category-tree" id="category-tree">
          <!-- Categories will be populated here -->
        </div>
      </div>

      <button type="submit" class="button">Save Product</button>
    </form>
  </div>

  <script src="sidebar.js"></script>
</body>
</html>
