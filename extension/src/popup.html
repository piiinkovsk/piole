<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Piole</title>
  <style>
    body {
      width: 320px;
      min-height: 400px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    .header {
      display: flex;
      align-items: center;
      margin-bottom: 16px;
    }
    .header h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 600;
    }
    .tabs {
      display: flex;
      margin-bottom: 16px;
      border-bottom: 1px solid #e0e0e0;
    }
    .tab {
      padding: 8px 16px;
      cursor: pointer;
      border: none;
      background: none;
      font-size: 14px;
      font-weight: 500;
      color: #666;
      position: relative;
    }
    .tab.active {
      color: #000;
    }
    .tab.active:after {
      content: '';
      position: absolute;
      bottom: -1px;
      left: 0;
      right: 0;
      height: 2px;
      background-color: #4CAF50;
    }
    .form-group {
      margin-bottom: 16px;
    }
    .label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 8px;
    }
    .required:after {
      content: ' *';
      color: #f44336;
    }
    .form-control {
      width: 100%;
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
    }
    .category-select {
      margin-bottom: 8px;
    }
    .button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      background-color: #4CAF50;
      color: white;
    }
    .button:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }
    .category-tree {
      max-height: 200px;
      overflow-y: auto;
      border: 1px solid #ddd;
      border-radius: 4px;
      padding: 8px;
    }
    .category-item {
      margin: 4px 0;
      padding-left: 20px;
    }
    .category-item label {
      display: block;
      padding: 4px 0;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Save to Piole</h1>
  </div>

  <div class="tabs">
    <button class="tab active" data-tab="wishlist">Wishlist</button>
    <button class="tab" data-tab="collection">Collection</button>
  </div>

  <form id="product-form">
    <div class="form-group">
      <label class="label required">Product Name</label>
      <input type="text" class="form-control" id="product-name" required>
    </div>

    <div class="form-group">
      <label class="label required">Brand</label>
      <input type="text" class="form-control" id="product-brand" required>
    </div>

    <div class="form-group">
      <label class="label">Price</label>
      <input type="number" class="form-control" id="product-price" step="0.01">
    </div>

    <div class="form-group">
      <label class="label required">Category</label>
      <div class="category-tree" id="category-tree">
        <!-- Categories will be populated here -->
      </div>
    </div>

    <button type="submit" class="button">Save Product</button>
  </form>

  <script src="popup.js"></script>
</body>
</html>
